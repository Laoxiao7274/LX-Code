<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- 标题 -->
  <rect x="40" y="32" width="200" height="14" rx="3" fill="#334155"/>
  <rect x="40" y="54" width="140" height="8" rx="2" fill="#94a3b8"/>

  <!-- 网格线 -->
  <g stroke="#e2e8f0" stroke-width="1.5">
    <line x1="60" y1="100" x2="600" y2="100"/>
    <line x1="60" y1="160" x2="600" y2="160"/>
    <line x1="60" y1="220" x2="600" y2="220"/>
    <line x1="60" y1="280" x2="600" y2="280"/>
  </g>

  <!-- 折线 1 -->
  <polyline points="60,280 150,250 240,260 330,210 420,220 510,170 600,150"
    fill="none" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 折线 2 -->
  <polyline points="60,280 150,270 240,240 330,250 420,180 510,190 600,120"
    fill="none" stroke="#10b981" stroke-width="3.5" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 柱状图 -->
  <rect x="120" y="230" width="40" height="50" rx="4" fill="#6366f1" opacity="0.5"/>
  <rect x="260" y="210" width="40" height="70" rx="4" fill="#a855f7" opacity="0.5"/>
  <rect x="400" y="190" width="40" height="90" rx="4" fill="#06b6d4" opacity="0.5"/>

  <!-- 图例 -->
  <rect x="40" y="330" width="18" height="18" rx="4" fill="#6366f1"/>
  <rect x="70" y="333" width="60" height="10" rx="2" fill="#94a3b8"/>
  <rect x="150" y="330" width="18" height="18" rx="4" fill="#10b981"/>
  <rect x="180" y="333" width="60" height="10" rx="2" fill="#94a3b8"/>
</svg>
