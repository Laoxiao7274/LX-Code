<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LXCode 更新服务 · 管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;--border2:#21262d;--text:#c9d1d9;--muted:#8b949e;--dim:#6e7681;--accent:#58a6ff;--accent2:#1f6feb;--danger:#f85149;--success:#238636;--warn:#d29922}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
code{background:var(--bg3);padding:2px 6px;border-radius:4px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px}
input,textarea,button,select{font:inherit;color:inherit}
input,textarea{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 12px;width:100%;outline:none;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:120px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px}
button{cursor:pointer;border:1px solid var(--border);background:var(--bg2);border-radius:6px;padding:8px 16px;transition:all .15s;font-size:14px}
button:hover{border-color:var(--accent);background:var(--bg3)}
button.primary{background:var(--success);border-color:var(--success);color:#fff;font-weight:600}
button.primary:hover{background:#2ea043;border-color:#2ea043}
button.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
button.danger:hover{background:var(--danger);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}

/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:360px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:40px 32px}
.login-card h1{font-size:22px;font-weight:600;margin-bottom:6px}
.login-card h1 .mark{color:var(--accent)}
.login-card .hint{color:var(--muted);font-size:13px;margin-bottom:24px}
.login-card .field{margin-bottom:16px}
.login-card label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.login-err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px}

/* layout */
.app{max-width:1100px;margin:0 auto;padding:32px 24px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.topbar h1{font-size:22px;font-weight:600}h1 .mark{color:var(--accent)}
.topbar .actions{display:flex;gap:10px;align-items:center}
.topbar .home-link{color:var(--dim);font-size:13px}

.panel{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:24px;margin-bottom:24px}
.panel h2{font-size:15px;font-weight:600;margin-bottom:18px;color:var(--text);display:flex;align-items:center;gap:8px}
.panel h2 .idx{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--accent2);color:#fff;border-radius:50%;font-size:12px}
.form-row{display:grid;gap:14px;margin-bottom:14px}
.form-row.two{grid-template-columns:1fr 1fr}
@media(max-width:640px){.form-row.two{grid-template-columns:1fr}}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field .hint{font-size:12px;color:var(--dim);margin-top:4px}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}

/* dropzone */
.drop{border:2px dashed var(--border);border-radius:8px;padding:28px;text-align:center;color:var(--muted);cursor:pointer;transition:all .15s;background:var(--bg)}
.drop:hover,.drop.drag{border-color:var(--accent);color:var(--accent);background:var(--bg3)}
.drop input{display:none}
.drop .files{margin-top:12px;text-align:left}
.drop .file-item{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--bg3);border-radius:4px;margin-top:6px;font-size:13px;font-family:ui-monospace,SFMono-Regular,monospace}
.drop .file-item .rm{color:var(--danger);cursor:pointer;background:none;border:none;padding:0 4px}
.upload-progress{height:4px;background:var(--bg3);border-radius:2px;margin-top:8px;overflow:hidden;display:none}
.upload-progress .bar{height:100%;background:var(--accent);width:0;transition:width .2s}

/* version cards */
.ver-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:14px}
.ver-card.is-latest{border-color:var(--success);box-shadow:0 0 0 1px var(--success)}
.ver-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.ver-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ver-title .v{font-size:18px;font-weight:600;color:var(--accent);font-family:ui-monospace,SFMono-Regular,monospace}
.ver-title .badge{background:var(--success);color:#fff;font-size:11px;padding:2px 10px;border-radius:10px;font-weight:600}
.ver-title .label{background:var(--accent2);color:#fff;font-size:11px;padding:2px 10px;border-radius:4px}
.ver-title .date{color:var(--dim);font-size:13px}
.ver-actions{display:flex;gap:8px;flex-wrap:wrap}
.ver-files{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.ver-file{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px}
.ver-file .size{color:var(--dim);font-size:11px}
.ver-notes{margin-top:12px;background:var(--bg);border-left:3px solid var(--border);padding:10px 14px;border-radius:4px;font-size:13px;color:var(--muted);white-space:pre-wrap}
.ver-notes code{color:var(--accent);background:var(--bg3)}
.empty{text-align:center;color:var(--muted);padding:48px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 18px;font-size:14px;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transform:translateY(10px);transition:all .2s}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{border-color:var(--success)}.toast.err{border-color:var(--danger)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
.modal{width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:24px}
.modal h3{font-size:16px;margin-bottom:8px}.modal p{color:var(--muted);font-size:14px;margin-bottom:20px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = { authed:null, versions:[], manifest:null, loading:true, uploading:false };

function toast(msg, type='ok'){
  const t=$('#toast'); t.textContent=msg; t.className='toast show '+type;
  setTimeout(()=>t.className='toast '+type,2600);
}
async function api(path, opts={}){
  const res = await fetch(path, {credentials:'same-origin', ...opts});
  if(!res.ok){ const j=await res.json().catch(()=>({})); throw new Error(j.error||res.statusText); }
  return res;
}

// ---- auth ----
async function checkAuth(){
  try{ const r=await api('/api/admin/auth'); state.authed=(await r.json()).authed; }
  catch{ state.authed=false; }
}
async function login(token){
  const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token})});
  return r.ok;
}
async function logout(){ await fetch('/api/logout',{method:'POST'}); state.authed=false; render(); }

// ---- data ----
async function loadVersions(){ state.versions=(await (await api('/api/admin/versions')).json()).versions; }
async function loadManifest(){ state.manifest=await (await api('/api/admin/manifest')).json(); }

// ---- render ----
function render(){
  if(state.authed===null){ $('#app').innerHTML='<div style="text-align:center;padding:80px;color:var(--muted)">加载中…</div>'; return; }
  if(!state.authed){ renderLogin(); return; }
  renderDashboard();
}

function renderLogin(){
  $('#app').innerHTML = `<div class="login-wrap"><div class="login-card">
    <h1><span class="mark">LX</span>Code 管理</h1>
    <div class="hint">输入管理 token 登录</div>
    <form id="loginForm">
      <div class="field"><label>Token</label><input type="password" id="loginToken" placeholder="PUBLISH_TOKEN" autofocus></div>
      <button type="submit" class="primary" style="width:100%">登录</button>
      <div class="login-err" id="loginErr"></div>
    </form>
  </div></div>`;
  $('#loginForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const ok = await login($('#loginToken').value.trim());
    if(ok){ state.authed=true; await loadVersions(); await loadManifest(); render(); }
    else $('#loginErr').textContent='token 错误';
  });
}

function renderDashboard(){
  const latest = state.manifest?.version ? `v${state.manifest.version}` : '未发布';
  $('#app').innerHTML = `<div class="app">
    <div class="topbar">
      <h1><span class="mark">LX</span>Code 管理</h1>
      <div class="actions">
        <span style="color:var(--dim);font-size:13px">当前最新:<strong style="color:var(--accent)">${esc(latest)}</strong></span>
        <a class="home-link" href="/">← 首页</a>
        <button onclick="doLogout()">登出</button>
      </div>
    </div>
    <div class="panel">
      <h2><span class="idx">1</span> 新建版本</h2>
      <form id="newVerForm">
        <div class="form-row two">
          <div class="field"><label>版本号</label><input id="nv_version" placeholder="0.2.1" pattern="\\d+\\.\\d+\\.\\d+" required>
            <div class="hint">语义化版本,如 0.2.1</div></div>
          <div class="field"><label>标签(可选)</label><input id="nv_label" placeholder="内测 / 稳定"></div>
        </div>
        <div class="field" style="margin-bottom:14px"><label>更新日志</label>
          <textarea id="nv_notes" placeholder="## 新功能&#10;- xxx&#10;&#10;## 修复&#10;- yyy"></textarea>
          <div class="hint">支持 Markdown 语法,会显示在版本列表</div></div>
        <div class="field"><label>上传文件</label>
          <div class="drop" id="dropzone">
            <input type="file" id="fileInput" multiple>
            点击或拖入文件(NSIS setup.exe + 对应 .sig)
            <div class="files" id="fileList"></div>
            <div class="upload-progress" id="uprog"><div class="bar" id="ubar"></div></div>
          </div>
          <div class="hint">.sig 文件名需与 setup.exe 对应(LXCode_x.y.z_x64-setup.exe + LXCode_x.y.z_x64-setup.exe.sig)</div>
        </div>
        <div class="form-actions">
          <button type="submit" class="primary" id="createBtn">创建并上传</button>
        </div>
      </form>
    </div>
    <div class="panel">
      <h2><span class="idx">2</span> 已发布版本</h2>
      <div id="verList"></div>
    </div>
  </div>`;
  setupDropzone();
  $('#newVerForm').addEventListener('submit', onCreateVersion);
  renderVerList();
}

let pendingFiles = [];
function setupDropzone(){
  const dz=$('#dropzone'), fi=$('#fileInput');
  pendingFiles=[];
  renderFileList();
  dz.addEventListener('click',e=>{ if(e.target.tagName!=='BUTTON'&&!e.target.classList.contains('rm')) fi.click(); });
  fi.addEventListener('change',()=>{ pendingFiles.push(...fi.files); renderFileList(); fi.value=''; });
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag');}));
  dz.addEventListener('drop',e=>{ pendingFiles.push(...e.dataTransfer.files); renderFileList(); });
}
function renderFileList(){
  const el=$('#fileList');
  el.innerHTML = pendingFiles.map((f,i)=>
    `<div class="file-item"><span>${esc(f.name)} <span style="color:var(--dim)">(${(f.size/1024/1024).toFixed(1)}MB)</span></span><button class="rm" onclick="rmFile(${i})">✕</button></div>`).join('');
}
window.rmFile = i => { pendingFiles.splice(i,1); renderFileList(); };

async function onCreateVersion(e){
  e.preventDefault();
  const version=$('#nv_version').value.trim();
  const label=$('#nv_label').value.trim();
  const notes=$('#nv_notes').value.trim();
  if(!/^\d+\.\d+\.\d+$/.test(version)){ toast('版本号格式错误','err'); return; }
  if(pendingFiles.length===0){ toast('请上传至少 setup.exe 和 .sig','err'); return; }
  const hasSetup=pendingFiles.some(f=>/setup\.exe$/i.test(f.name));
  const hasSig=pendingFiles.some(f=>/\.sig$/i.test(f.name));
  if(!hasSetup||!hasSig){ toast('需要 setup.exe 和 .sig 文件','err'); return; }
  const btn=$('#createBtn'); btn.disabled=true; btn.textContent='上传中…';
  try{
    // 1. 创建版本元数据
    await api('/api/admin/version',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({version,label,notes})});
    // 2. 逐个上传文件
    for(let i=0;i<pendingFiles.length;i++){
      const f=pendingFiles[i];
      btn.textContent=`上传 ${i+1}/${pendingFiles.length}…`;
      const res=await fetch(`/api/admin/upload?v=${version}&f=${encodeURIComponent(f.name)}`,{method:'POST',credentials:'same-origin',body:f,duplex:'half'});
      if(!res.ok){ const j=await res.json().catch(()=>({})); throw new Error(`上传 ${f.name} 失败: ${j.error||res.status}`); }
    }
    toast(`v${version} 创建成功`);
    pendingFiles=[]; renderFileList();
    $('#nv_version').value=''; $('#nv_label').value=''; $('#nv_notes').value='';
    await loadVersions(); renderVerList();
  }catch(err){ toast(err.message,'err'); }
  finally{ btn.disabled=false; btn.textContent='创建并上传'; }
}

function renderVerList(){
  const el=$('#verList');
  if(!state.versions.length){ el.innerHTML='<div class="empty">还没有版本</div>'; return; }
  el.innerHTML = state.versions.map(v=>{
    const isLatest = state.manifest?.version && `v${state.manifest.version}`===v.version;
    const base = location.origin;
    return `<div class="ver-card${isLatest?' is-latest':''}">
      <div class="ver-head">
        <div class="ver-title">
          <span class="v">${esc(v.version)}</span>
          ${isLatest?'<span class="badge">最新</span>':''}
          ${v.label?`<span class="label">${esc(v.label)}</span>`:''}
          <span class="date">${esc(new Date(v.createdAt).toISOString().slice(0,19).replace('T',' '))}</span>
        </div>
        <div class="ver-actions">
          ${isLatest?'':`<button onclick="doPublish('${esc(v.version)}')">设为最新</button>`}
          <button onclick="doDelete('${esc(v.version)}')" class="danger">删除</button>
        </div>
      </div>
      <div class="ver-files">${v.files.map(f=>{
        const url=`${base}/releases/${encodeURIComponent(v.version)}/${encodeURIComponent(f)}`;
        let size=''; try{size=' · '+(statFake(f)/1024/1024).toFixed(1)+'MB';}catch{}
        return `<a class="ver-file" href="${url}" target="_blank">${esc(f)}${size?'<span class="size">'+size+'</span>':''}</a>`;
      }).join('')}</div>
      ${v.notes?`<div class="notes">${mdLite(esc(v.notes))}</div>`:''}
    </div>`;
  }).join('');
}
// 简易 markdown:代码块/行内代码/标题/列表/加粗
function mdLite(s){
  return s.replace(/```([\s\S]*?)```/g,(m,c)=>`<pre style="background:var(--bg);padding:10px;border-radius:4px;overflow:auto"><code>${c}</code></pre>`)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^### (.+)$/gm,'<strong style="color:var(--text)">$1</strong>')
    .replace(/^## (.+)$/gm,'<strong style="color:var(--accent);font-size:14px">$1</strong>')
    .replace(/^- (.+)$/gm,'• $1')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\n/g,'<br>');
}
// ver-file 里没有真实 size,留空
function statFake(){ return 0; }

window.doPublish = async function(v){
  if(!confirm(`将 v${v} 设为最新发布?(会更新 latest.json)`)) return;
  try{
    const res=await api('/api/admin/publish',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({version:v})});
    const j=await res.json();
    toast(`v${v} 已发布为最新`);
    state.manifest=j.manifest;
    renderVerList();
    // 更新 topbar
    const tb=document.querySelector('.topbar strong'); if(tb) tb.textContent=`v${v}`;
  }catch(err){ toast(err.message,'err'); }
};
window.doDelete = async function(v){
  if(!confirm(`删除版本 ${v}?此操作不可恢复(目录和文件都会删,且从 latest.json 移除对应条目)`)) return;
  try{
    await api(`/api/admin/version?v=${encodeURIComponent(v)}`,{method:'DELETE'});
    toast(`已删除 ${v}`);
    await loadVersions(); renderVerList();
    await loadManifest(); renderVerList();
  }catch(err){ toast(err.message,'err'); }
};
window.doLogout = logout;

// ---- init ----
(async function init(){
  await checkAuth();
  if(state.authed){ await loadVersions(); await loadManifest(); }
  render();
})();
</script>
</body>
</html>
